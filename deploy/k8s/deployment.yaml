apiVersion: apps/v1
kind: Deployment
metadata:
  name: behavioriq-deployment
  namespace: security-soc
  labels:
    app: behavioriq
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: behavioriq
  template:
    metadata:
      labels:
        app: behavioriq
    spec:
      containers:
      - name: behavioriq-soc
        image: behavioriq/engine:v4.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.security-soc.svc.cluster.local:9092"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/status
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/status
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: behavioriq-service
  namespace: security-soc
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: behavioriq
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: behavioriq-hpa
  namespace: security-soc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: behavioriq-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
